name: Image

# Builds the Sway Atomic bootc images (bootc/Containerfile) and pushes them to
#   ghcr.io/<owner>/machine-setup-sway:desktop, :desktop-nvidia and :server
# weekly (to pick up Fedora's updates), when bootc/ changes on main, and by
# hand. (Pull requests test them in test.yml: a VM built from the image.)
# Then builds a test VM disk from the desktop and server images and pushes it
# to ghcr.io/<owner>/machine-setup-sway-testdisk:desktop and :server, so pull
# requests that don't change bootc/ can boot it instead of building one.
# Optional repository secrets:
#   AKMODS_KEY, AKMODS_CERT   sign the NVIDIA driver for Secure Boot (bootc/nvidia.sh)
#   COSIGN_PRIVATE_KEY, COSIGN_PASSWORD   sign the images (public key: bootc/cosign.pub)
on:
  push:
    branches: [main]
    paths: [bootc/**, .github/workflows/image.yml]
  schedule:
    - cron: "0 5 * * 2"   # Tuesdays; Fedora's own images update daily
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: desktop, profile: desktop, nvidia: "false" }
          - { tag: desktop-nvidia, profile: desktop, nvidia: "true" }
          - { tag: server, profile: server, nvidia: "false" }
    name: build (${{ matrix.tag }})
    steps:
      - uses: actions/checkout@v4

      # Runners have ~145 GB disks with plenty free; only clean up (slow, ~2 min)
      # if there isn't room for the image and the VM disk.
      - name: Free disk space if needed
        run: |
          df -h /
          if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 40 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi

      - name: Check for a signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -n "$COSIGN_PRIVATE_KEY" ] && [ -f bootc/cosign.pub ]; then
            echo SIGN=true >> "$GITHUB_ENV"
          elif [ -f bootc/cosign.pub ]; then
            # The image would tell machines to require signatures it doesn't have.
            echo "::error::bootc/cosign.pub is committed but the COSIGN_PRIVATE_KEY secret is missing."
            exit 1
          else
            echo "::warning::Images are not signed: add the COSIGN_PRIVATE_KEY secret and commit bootc/cosign.pub."
          fi

      - name: Build
        env:
          AKMODS_KEY: ${{ secrets.AKMODS_KEY }}
          AKMODS_CERT: ${{ secrets.AKMODS_CERT }}
        run: |
          secrets=()
          if [ "${{ matrix.nvidia }}" = true ] && [ -n "$AKMODS_KEY" ] && [ -n "$AKMODS_CERT" ]; then
            umask 077
            printf '%s\n' "$AKMODS_KEY" > "$RUNNER_TEMP/akmods_key"
            printf '%s' "$AKMODS_CERT" | base64 -d > "$RUNNER_TEMP/akmods_cert"
            secrets=(--secret "id=akmods_key,src=$RUNNER_TEMP/akmods_key" --secret "id=akmods_cert,src=$RUNNER_TEMP/akmods_cert")
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/machine-setup-sway"
          DATE="$(date +%Y%m%d)"
          printf 'IMAGE=%s\nDATE=%s\n' "$IMAGE" "$DATE" >> "$GITHUB_ENV"
          sudo podman build --pull=newer --layers=false -f bootc/Containerfile \
            --build-arg PROFILE=${{ matrix.profile }} --build-arg NVIDIA=${{ matrix.nvidia }} \
            --build-arg IMAGE_REPO="$IMAGE" \
            ${secrets[@]+"${secrets[@]}"} \
            -t "$IMAGE:${{ matrix.tag }}" \
            -t "$IMAGE:${{ matrix.tag }}-$DATE" .
          rm -f "$RUNNER_TEMP/akmods_key" "$RUNNER_TEMP/akmods_cert"

      - name: Push
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          sudo podman push --digestfile "$RUNNER_TEMP/digest" "$IMAGE:${{ matrix.tag }}"
          sudo podman push "$IMAGE:${{ matrix.tag }}-$DATE"
          echo "DIGEST=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_ENV"

      - name: Install cosign
        if: env.SIGN == 'true'
        uses: sigstore/cosign-installer@v3

      # Signs the pushed image (both tags share the digest). Machines check
      # this with bootc/cosign.pub.
      - name: Sign
        if: env.SIGN == 'true'
        env:
          TOKEN: ${{ github.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "$TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"

  # A VM disk for tests/atomic-vm-test.sh --disk, from the image just pushed:
  # the "tester" user, passwordless sudo and sshd, plus the SSH key to log in
  # (a throwaway key for a VM only reachable from inside the CI runner).
  test-disk:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, server]
    name: test-disk (${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v4

      # bootc-image-builder's mounts fail with "permission denied" on the
      # runner image of 2026-11-11 without this (see test.yml).
      - name: Relax AppArmor for bootc-image-builder
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build the disk
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/machine-setup-sway"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          tests/atomic-vm-test.sh --profile ${{ matrix.profile }} \
            --pull-image "$IMAGE:${{ matrix.profile }}" --disk-only "$RUNNER_TEMP/disk"

      - name: Push the disk
        run: |
          printf 'FROM scratch\nCOPY disk.qcow2.zst id_ed25519 /\n' > "$RUNNER_TEMP/disk/Containerfile"
          sudo podman build -t "$IMAGE-testdisk:${{ matrix.profile }}" "$RUNNER_TEMP/disk"
          sudo podman push "$IMAGE-testdisk:${{ matrix.profile }}"
