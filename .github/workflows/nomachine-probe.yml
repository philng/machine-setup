name: NoMachine probe

on:
  push:
    branches: [probe-nomachine]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: What the download server returns
        run: |
          u=https://download.nomachine.com/download/9.8/Linux/nomachine_9.8.2_1_x86_64.rpm
          t=https://download.nomachine.com/download/9.8/Linux/nomachine_9.8.2_1_x86_64.tar.gz
          for url in "$u" "$t" https://web9001.nomachine.com/download/9.8/Linux/nomachine_9.8.2_1_x86_64.rpm; do
            echo "=== $url (curl default UA)"; curl -sIL "$url" | grep -iE '^(HTTP|location|content-type|content-length)'
            echo "=== $url (Wget UA)"; curl -sIL -A 'Wget/1.21' "$url" | grep -iE '^(HTTP|location|content-type|content-length)'
          done
          echo "=== body via GET -L"; curl -sL -A 'Wget/1.21' "$u" -o /tmp/nm; file /tmp/nm; ls -l /tmp/nm; head -c 600 /tmp/nm | strings | head -20
      - name: Run the role in a Fedora container
        if: false
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:latest bash -c '
            dnf -y -q install ansible-core python3-libdnf5 &&
            ansible-galaxy collection install -r requirements.yml &&
            ansible-playbook -i inventory.ini tests/nomachine.yml -e use_sudo=false -e target_user=root &&
            rpm -q nomachine'
