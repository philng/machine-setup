name: NoMachine probe

on:
  push:
    branches: [probe-nomachine]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: What the download server returns
        run: |
          u=https://download.nomachine.com/download/9.8/Linux/nomachine_9.8.2_1_x86_64.rpm
          echo "--- Linux guess, headers"; curl -sI "$u" | head -12
          echo "--- Mac dmg from the cask"; curl -sI https://download.nomachine.com/download/9.8/MacOSX/nomachine_9.8.2_1.dmg | head -12
          echo "--- AUR PKGBUILD"; curl -sL "https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=nomachine" | grep -Ei 'pkgver|_build|source|nomachine.com|x86_64' | head -20
          for p in "https://downloads.nomachine.com/download/?id=1" "https://downloads.nomachine.com/download/?id=2" "https://downloads.nomachine.com/linux/?id=1" "https://www.nomachine.com/download/download&id=1" "https://www.nomachine.com/dwl_nm_bann.php"; do
            echo "--- $p"
            curl -sL "$p" | grep -oE '[A-Za-z0-9_./:?=&-]*(nomachine_[0-9][^"<> ]*|9[.]8[.][0-9_]+[^"<> ]*)' | sort -u | head -15
          done
      - name: Run the role in a Fedora container
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:latest bash -c '
            dnf -y -q install ansible-core python3-libdnf5 &&
            ansible-galaxy collection install -r requirements.yml &&
            ansible-playbook -i inventory.ini tests/nomachine.yml -e use_sudo=false -e target_user=root &&
            rpm -q nomachine'
