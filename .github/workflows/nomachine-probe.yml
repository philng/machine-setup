name: NoMachine probe

on:
  push:
    branches: [probe-nomachine]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: What the download server returns
        run: |
          cask=$(curl -fsSL https://raw.githubusercontent.com/Homebrew/homebrew-cask/main/Casks/n/nomachine.rb)
          echo "$cask" | grep -E '^\s*version'
          ver=$(echo "$cask" | sed -n 's/^ *version "\([0-9.]*\)_[0-9]*"/\1/p')
          mm=$(echo "$ver" | cut -d. -f1-2)
          for n in $(seq 1 30); do
            url="https://download.nomachine.com/download/$mm/Linux/nomachine_${ver}_${n}_x86_64.rpm"
            printf '%-90s ' "$url"
            curl -sI -o /dev/null -w '%{http_code} %{content_type} %{size_download}\n' "$url"
          done
          echo "--- GET of build 1 (first 300 bytes)"
          curl -sL "https://download.nomachine.com/download/$mm/Linux/nomachine_${ver}_1_x86_64.rpm" | head -c 300; echo
          echo "--- livecheck page"
          curl -sIL https://www.nomachine.com/dwl_nm_bann.php | head -20
      - name: Run the role in a Fedora container
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:latest bash -c '
            dnf -y -q install ansible-core python3-libdnf5 &&
            ansible-galaxy collection install -r requirements.yml &&
            ansible-playbook -i inventory.ini tests/nomachine.yml -e use_sudo=false -e target_user=root &&
            rpm -q nomachine'
