name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      dotfiles_version:
        description: Branch, tag or commit of the dotfiles repo to test
        default: HEAD
  schedule:
    - cron: "0 6 1 * *"   # monthly, to catch upstream breakage (renamed packages, moved downloads)

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true    # a new push replaces a run that's testing an old commit

permissions:
  contents: read

jobs:
  # Pull requests that only touch docs skip the slow tests (and still merge).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "$changed"
          if echo "$changed" | grep -qvE '(\.md$|^LICENSE$|^\.gitignore$)'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: pip install ansible-core ansible-lint shellcheck-py
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: ansible-lint
        run: ansible-lint
      - name: shellcheck
        run: shellcheck bootstrap.sh tests/*.sh

  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run the setup and check the result
        run: tests/mac-test.sh

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path windows/bootstrap.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: Check winget package IDs exist
        shell: pwsh
        run: ./windows/bootstrap.ps1 -CheckOnly

  fedora-atomic-vm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # From this repo's bootc image (bootc/Containerfile), as the
          # machines run it.
          - { profile: desktop, source: image, flags: --build-image }
          - { profile: server, source: image, flags: --build-image }
          # Plain Sway Atomic, where the playbook layers the packages itself.
          - { profile: desktop, source: layered, flags: "" }
    name: fedora-atomic-vm (${{ matrix.profile }}, ${{ matrix.source }})
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils

      # Building the VM disk needs room for the image and the disk (~20 GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Run VM test
        run: >-
          tests/atomic-vm-test.sh --profile ${{ matrix.profile }} ${{ matrix.flags }}
          --github-user ${{ github.repository_owner }}
          --dotfiles-version ${{ inputs.dotfiles_version || 'HEAD' }}

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atomic-vm-test-logs-${{ matrix.profile }}-${{ matrix.source }}
          path: ~/.cache/machine-setup-vm/logs/
          if-no-files-found: ignore

  # The NVIDIA image can't be booted without an NVIDIA GPU; check it builds
  # (the driver compiles for the image's kernel).
  image-nvidia:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build the desktop-nvidia image
        run: sudo podman build --pull=newer -f bootc/Containerfile --build-arg NVIDIA=true -t machine-setup-sway:desktop-nvidia .

  # Merges a pull request once every test above passes. Skipped for drafts,
  # for PRs labelled "no-automerge", and for PRs from forks.
  automerge:
    needs: [changes, lint, macos, windows, fedora-atomic-vm, image-nvidia]
    # always() so it still runs when docs-only PRs skip the tests; it merges
    # only if nothing failed or was cancelled.
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'no-automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the pull request
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
