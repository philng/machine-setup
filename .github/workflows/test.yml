name: Test

# No run on pushes to main: pull requests only merge (automerge below) after
# this workflow passes, so a run after the merge would repeat the same tests.
# The monthly schedule catches upstream breakage.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      dotfiles_version:
        description: Branch, tag or commit of the dotfiles repo to test
        default: HEAD
  schedule:
    - cron: "0 6 1 * *"   # monthly, to catch upstream breakage (renamed packages, moved downloads)

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true    # a new push replaces a run that's testing an old commit

permissions:
  contents: read

jobs:
  # Works out which tests a pull request needs, from the files it changes:
  #   docs only (*.md, LICENSE, .gitignore)  no tests (and still merges)
  #   windows/                               the windows job
  #   Mac-only roles and tests               the macos job
  #   bootc/, Linux-only roles and tests     the Fedora VM tests (+ NVIDIA build for bootc/)
  #   shared Ansible (site.yml, shared roles, bootstrap.sh...)  macos + Fedora VM tests
  #   vars/apps.yml                          those + windows (bootstrap.ps1 mirrors it)
  #   .github/workflows/                     everything
  # Draft pull requests get lint only; marking one ready runs the rest.
  # The schedule and manual runs test everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      windows: ${{ steps.diff.outputs.windows }}
      mac: ${{ steps.diff.outputs.mac }}
      linux: ${{ steps.diff.outputs.linux }}
      nvidia: ${{ steps.diff.outputs.nvidia }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set_all() { for k in code windows mac linux nvidia; do echo "$k=$1" >> "$GITHUB_OUTPUT"; done; }
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            set_all true; exit 0
          fi
          code=false windows=false mac=false linux=false nvidia=false
          while read -r f; do
            [ -z "$f" ] && continue
            echo "$f"
            case "$f" in
              *.md|LICENSE|.gitignore) continue ;;
            esac
            code=true
            case "$f" in
              windows/*) windows=true ;;
              roles/casks/*|roles/macos/*|roles/packages/*|tests/mac-*.sh) mac=true ;;
              bootc/*) linux=true nvidia=true ;;
              roles/flatpak/*|roles/tailscale/*|roles/remote_desktop/*|roles/jetbrains_toolbox/*|roles/server/*) linux=true ;;
              tests/atomic-vm-test.sh|tests/vm-desktop-vars.yml|vars/server.yml) linux=true ;;
              .github/workflows/*) windows=true mac=true linux=true nvidia=true ;;
              vars/apps.yml) windows=true mac=true linux=true ;;   # windows/bootstrap.ps1 mirrors it
              *) mac=true linux=true ;;   # shared Ansible (site.yml, roles, bootstrap.sh...)
            esac
          done <<< "$(git diff --name-only "$BASE...$HEAD")"
          if [ "$DRAFT" = true ]; then
            echo "Draft pull request: lint only."
            windows=false mac=false linux=false nvidia=false
          fi
          printf 'code=%s\nwindows=%s\nmac=%s\nlinux=%s\nnvidia=%s\n' \
            "$code" "$windows" "$mac" "$linux" "$nvidia" | tee -a "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: pip install ansible-core ansible-lint shellcheck-py
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: ansible-lint
        run: ansible-lint
      - name: shellcheck
        run: shellcheck bootstrap.sh tests/*.sh

  macos:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run the setup and check the result
        run: tests/mac-test.sh

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path windows/bootstrap.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: Check winget package IDs exist
        shell: pwsh
        run: ./windows/bootstrap.ps1 -CheckOnly

  fedora-atomic-vm:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, server]
    name: fedora-atomic-vm (${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner image of 2026-11-11 (Ubuntu with podman 5.7) loads the
      # AppArmor profile that confines bwrap ("unpriv_bwrap"). It also catches
      # the bwrap that bootc-image-builder runs inside its container, which
      # then can't mount ("permission denied"). Unload it: this runner is
      # thrown away after the job.
      - name: Let bootc-image-builder use bwrap
        run: |
          for f in $(sudo grep -lE '^profile (unpriv_)?bwrap' /etc/apparmor.d/* 2>/dev/null); do
            echo "Unloading $f"; sudo apparmor_parser -R "$f" || true
          done
          sudo aa-status | grep -i bwrap || echo "No bwrap AppArmor profiles loaded."

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils

      # Building the VM disk needs room for the image and the disk (~20 GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Run VM test
        run: >-
          tests/atomic-vm-test.sh --profile ${{ matrix.profile }}
          --github-user ${{ github.repository_owner }}
          --dotfiles-version ${{ inputs.dotfiles_version || 'HEAD' }}

      - name: Show kernel messages
        if: failure()
        run: sudo dmesg | tail -40

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atomic-vm-test-logs-${{ matrix.profile }}
          path: ~/.cache/machine-setup-vm/logs/
          if-no-files-found: ignore

  # The NVIDIA image can't be booted without an NVIDIA GPU; check it builds
  # (the driver compiles for the image's kernel).
  image-nvidia:
    needs: changes
    if: needs.changes.outputs.nvidia == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build the desktop-nvidia image
        run: sudo podman build --pull=newer -f bootc/Containerfile --build-arg NVIDIA=true -t machine-setup-sway:desktop-nvidia .

  # Merges a pull request once every test above passes. Skipped for drafts,
  # for PRs labelled "no-automerge", and for PRs from forks.
  automerge:
    needs: [changes, lint, macos, windows, fedora-atomic-vm, image-nvidia]
    # always() so it still runs when tests are skipped (docs-only or
    # single-platform PRs); it merges only if nothing failed or was cancelled.
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'no-automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the pull request
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
