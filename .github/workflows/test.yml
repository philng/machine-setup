name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true    # a new push replaces a run that's testing an old commit

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: pip install ansible-core ansible-lint shellcheck-py
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: ansible-lint
        run: ansible-lint
      - name: shellcheck
        run: shellcheck bootstrap.sh tests/vm-test.sh tests/mac-test.sh

  macos:
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run the setup and check the result
        # nomachine.com redirects downloads from GitHub's servers to its home page.
        run: tests/mac-test.sh --skip-nomachine

  windows:
    if: github.event_name != 'pull_request'   # already green; saves minutes while the macOS job is fixed
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path windows/bootstrap.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: Check winget package IDs exist
        shell: pwsh
        run: ./windows/bootstrap.ps1 -CheckOnly

  fedora-vm:
    if: github.event_name != 'pull_request'   # already green; saves minutes while the macOS job is fixed
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Cache Fedora image
        uses: actions/cache@v4
        with:
          path: ~/.cache/machine-setup-vm/*.qcow2
          key: fedora-cloud-43-v1

      - name: Run VM test
        # nomachine.com redirects downloads from GitHub's servers to its home page.
        run: tests/vm-test.sh --skip-nomachine

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-logs
          path: ~/.cache/machine-setup-vm/logs/
          if-no-files-found: ignore
