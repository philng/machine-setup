name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      dotfiles_version:
        description: Branch, tag or commit of the dotfiles repo to test
        default: HEAD
  schedule:
    - cron: "0 6 1 * *"   # monthly, to catch upstream breakage (renamed packages, moved downloads)

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true    # a new push replaces a run that's testing an old commit

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: pip install ansible-core ansible-lint shellcheck-py
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: ansible-lint
        run: ansible-lint
      - name: shellcheck
        run: shellcheck bootstrap.sh tests/*.sh

  macos:
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run the setup and check the result
        run: tests/mac-test.sh

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path windows/bootstrap.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: Check winget package IDs exist
        shell: pwsh
        run: ./windows/bootstrap.ps1 -CheckOnly

  fedora-vm:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, server]
    name: fedora-vm (${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Cache Fedora image
        uses: actions/cache@v4
        with:
          path: ~/.cache/machine-setup-vm/*.qcow2
          key: fedora-cloud-43-v1

      - name: Run VM test
        run: >-
          tests/vm-test.sh --profile ${{ matrix.profile }}
          --github-user ${{ github.repository_owner }}
          --dotfiles-version ${{ inputs.dotfiles_version || 'HEAD' }}

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-logs-${{ matrix.profile }}
          path: ~/.cache/machine-setup-vm/logs/
          if-no-files-found: ignore

  # Merges a pull request once every test above passes. Skipped for drafts,
  # for PRs labelled "no-automerge", and for PRs from forks.
  automerge:
    needs: [lint, macos, windows, fedora-vm]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'no-automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the pull request
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
