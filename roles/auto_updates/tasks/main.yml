---
# Unattended package updates (Linux). macOS updates itself.
- name: Fedora automatic updates
  when:
    - ansible_facts.os_family == 'RedHat'
    - not ostree_booted | default(false)
  block:
    - name: Install dnf-automatic
      ansible.builtin.dnf:
        name: dnf-automatic
        state: present

    - name: Configure dnf-automatic
      community.general.ini_file:
        path: /etc/dnf/automatic.conf
        section: commands
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        mode: "0644"
      loop:
        - { option: upgrade_type, value: "{{ auto_updates_type }}" }
        - { option: apply_updates, value: "yes" }
        - { option: reboot, value: "{{ auto_updates_reboot }}" }

    - name: Find the dnf-automatic timer
      ansible.builtin.shell: >-
        set -o pipefail;
        systemctl list-unit-files --no-legend 'dnf*-automatic.timer' | awk '{print $1}' | head -1
      args:
        executable: /bin/bash
      register: dnf_automatic_timer
      changed_when: false
      check_mode: false   # read-only; also runs in --dry-run

    - name: Enable the dnf-automatic timer
      ansible.builtin.systemd_service:
        name: "{{ dnf_automatic_timer.stdout }}"
        enabled: true
        state: started
      when: dnf_automatic_timer.stdout | length > 0

# Fedora Atomic updates the whole image at once (no security-only option):
# rpm-ostreed downloads it in the background and it's used from the next boot.
- name: Fedora Atomic automatic updates
  when: ostree_booted | default(false)
  block:
    - name: Download updates automatically, use them on the next boot
      community.general.ini_file:
        path: /etc/rpm-ostreed.conf
        section: Daemon
        option: AutomaticUpdatePolicy
        value: stage
        mode: "0644"
        no_extra_spaces: true
      register: rpm_ostreed_conf

    - name: Reload rpm-ostreed  # noqa: no-handler
      ansible.builtin.command: rpm-ostree reload
      when: rpm_ostreed_conf is changed
      changed_when: true

    - name: Enable the automatic update timer
      ansible.builtin.systemd_service:
        name: rpm-ostreed-automatic.timer
        enabled: true
        state: started

    # auto_updates_reboot other than "never" (servers): restart at 4am when
    # a downloaded update is waiting.
    - name: Restart into downloaded updates
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: rpm-ostree-reboot.service
          content: |
            [Unit]
            Description=Restart into a downloaded Fedora Atomic update
            [Service]
            Type=oneshot
            ExecStart=/bin/sh -c 'rpm-ostree status --pending-exit-77 >/dev/null; [ $? -eq 77 ] && systemctl reboot || true'
        - name: rpm-ostree-reboot.timer
          content: |
            [Unit]
            Description=Restart into a downloaded Fedora Atomic update at 4am
            [Timer]
            OnCalendar=*-*-* 04:00
            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"
      when: auto_updates_reboot != 'never'

    - name: Enable the restart timer
      ansible.builtin.systemd_service:
        name: rpm-ostree-reboot.timer
        enabled: true
        state: started
        daemon_reload: true
      when: auto_updates_reboot != 'never'

- name: Debian/Ubuntu automatic security updates
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: ansible_facts.os_family == 'Debian'

- name: Weekly Flatpak updates
  when:
    - ansible_facts.os_family != 'Darwin'
    - flatpak_auto_update | bool
    - machine_gui | default(true) | bool   # no Flatpaks on a headless server
  block:
    - name: Flatpak update service
      ansible.builtin.copy:
        dest: /etc/systemd/system/flatpak-update.service
        mode: "0644"
        content: |
          [Unit]
          Description=Update Flatpak apps
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/flatpak update --system --noninteractive --assumeyes

    - name: Flatpak update timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/flatpak-update.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Update Flatpak apps weekly

          [Timer]
          OnCalendar=weekly
          Persistent=true
          RandomizedDelaySec=1h

          [Install]
          WantedBy=timers.target

    - name: Enable the Flatpak update timer
      ansible.builtin.systemd_service:
        name: flatpak-update.timer
        enabled: true
        state: started
        daemon_reload: true
