---
- name: Install flatpak
  ansible.builtin.package:
    name: flatpak
    state: present
  when: not ostree_booted | default(false)   # part of Fedora Atomic

- name: Add Flathub remote
  community.general.flatpak_remote:
    name: "{{ flatpak_remote_name }}"
    flatpakrepo_url: "{{ flatpak_remote_url }}"
    method: system
    state: present

# Fedora ships a filtered Flathub; make sure the full one is usable.
- name: Make sure Flathub is enabled
  community.general.flatpak_remote:
    name: "{{ flatpak_remote_name }}"
    enabled: true
    method: system

# Some apps download their payload from the vendor at install time (Spotify
# from snapcraft.io, Chrome from Google), which can time out; try again.
- name: Install Flatpak apps
  community.general.flatpak:
    name: "{{ flatpaks }}"
    remote: "{{ flatpak_remote_name }}"
    method: system
    state: present
  register: flatpak_install
  until: flatpak_install is succeeded
  retries: 3
  delay: 60
  when: flatpaks | length > 0

- name: Remove Flatpak apps
  community.general.flatpak:
    name: "{{ flatpaks_remove }}"
    method: system
    state: absent
  when: flatpaks_remove | length > 0
