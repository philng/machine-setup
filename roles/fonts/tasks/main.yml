---
# Installed per user into ~/.local/share/fonts/<name>; delete that folder
# and re-run to update.
- name: Install Nerd Fonts for {{ target_user }}
  become: "{{ use_sudo }}"
  become_user: "{{ target_user }}"
  when: nerd_fonts | length > 0
  block:
    - name: Check which fonts are installed
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.local/share/fonts/{{ item }}"
      loop: "{{ nerd_fonts }}"
      register: font_dirs

    - name: Create font folders
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/share/fonts/{{ item.item }}"
        state: directory
        mode: "0755"
      loop: "{{ font_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.stat.exists

    - name: Download and unpack fonts
      ansible.builtin.unarchive:
        src: "{{ nerd_fonts_url }}/{{ item.item }}.tar.xz"
        dest: "{{ ansible_facts.env.HOME }}/.local/share/fonts/{{ item.item }}"
        remote_src: true
      loop: "{{ font_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.stat.exists
      register: fonts_unpacked

    - name: Refresh the font cache  # noqa: no-handler
      ansible.builtin.command: fc-cache -f
      when: fonts_unpacked is changed
      changed_when: true
