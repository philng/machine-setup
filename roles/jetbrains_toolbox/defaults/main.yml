---
jetbrains_toolbox_enabled: false
# Where Toolbox installs itself; it self-updates here, so it is user-owned.
jetbrains_toolbox_dir: "{{ ansible_env.HOME }}/.local/share/JetBrains/Toolbox"
jetbrains_toolbox_api: https://data.services.jetbrains.com/products/releases?code=TBA&latest=true&type=release
jetbrains_toolbox_platform: "{{ 'linuxARM64' if ansible_architecture == 'aarch64' else 'linux' }}"
