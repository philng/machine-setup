---
# Full codecs and GPU drivers on Fedora, from RPM Fusion (enable "rpmfusion"
# in extra_repos). Follows https://rpmfusion.org/Howto/Multimedia.
- name: Codecs and drivers (Fedora)
  when: ansible_distribution == 'Fedora'
  block:
    - name: Check RPM Fusion is enabled
      ansible.builtin.assert:
        that: "'rpmfusion' in extra_repos"
        fail_msg: Add rpmfusion to extra_repos in vars/apps.yml for codecs and drivers.
        quiet: true

    - name: Check installed packages
      ansible.builtin.package_facts:

    # The dnf module can't swap packages, so use the dnf command.
    - name: Swap Fedora's limited ffmpeg for the full one  # noqa: command-instead-of-module
      ansible.builtin.command: dnf swap -y ffmpeg-free ffmpeg --allowerasing
      when: "'ffmpeg' not in ansible_facts.packages"
      changed_when: true

    - name: Install multimedia codecs
      ansible.builtin.dnf:
        name:
          - gstreamer1-plugins-bad-freeworld
          - gstreamer1-plugins-ugly
          - gstreamer1-libav
          - lame
        state: present
        install_weak_deps: false

    - name: Detect GPUs
      ansible.builtin.shell: set -o pipefail; lspci -nn | { grep -Ei 'vga|3d|display' || true; }
      args:
        executable: /bin/bash
      register: gpus
      changed_when: false
      check_mode: false   # read-only; also runs in --dry-run
      when: multimedia_gpu_drivers | bool

    - name: Intel hardware video decoding
      ansible.builtin.dnf:
        name: intel-media-driver
        state: present
      when:
        - multimedia_gpu_drivers | bool
        - "'Intel' in gpus.stdout"

    - name: AMD hardware video decoding  # noqa: command-instead-of-module
      ansible.builtin.command: dnf swap -y mesa-va-drivers mesa-va-drivers-freeworld --allowerasing
      when:
        - multimedia_gpu_drivers | bool
        - gpus.stdout is search('AMD|ATI|Radeon')
        - "'mesa-va-drivers-freeworld' not in ansible_facts.packages"
      changed_when: true

    - name: NVIDIA driver (built by akmods; reboot afterwards)
      ansible.builtin.dnf:
        name:
          - akmod-nvidia
          - xorg-x11-drv-nvidia-cuda
        state: present
      when:
        - multimedia_gpu_drivers | bool
        - "'NVIDIA' in gpus.stdout"
      register: nvidia_installed

    - name: NVIDIA next steps  # noqa: no-handler
      ansible.builtin.debug:
        msg:
          - "NVIDIA driver installed. Wait a few minutes for akmods to build it, then reboot."
          - "If Secure Boot is on, enroll the akmods key first: sudo mokutil --import /etc/pki/akmods/certs/public_key.der"
      when: nvidia_installed is changed
