---
# NoMachine (server + client in one package) isn't in distro repos or on
# Flathub, so on Linux it is installed from nomachine.com's own .rpm/.deb.
# On macOS it is the "nomachine" Homebrew cask (see casks in vars/apps.yml).
- name: Check whether NoMachine is installed
  ansible.builtin.package_facts:

- name: Find and install NoMachine
  when: "'nomachine' not in ansible_facts.packages"
  block:
    - name: Look up the latest NoMachine download
      ansible.builtin.uri:
        url: "{{ item }}"
        return_content: true
      register: nomachine_pages
      loop: "{{ nomachine_download_pages }}"
      failed_when: false
      when: nomachine_url | length == 0

    - name: Pick the package link for this machine
      ansible.builtin.set_fact:
        nomachine_pkg_url: >-
          {{ nomachine_url if nomachine_url | length > 0 else
             (nomachine_pages.results
              | map(attribute='content', default='')
              | join(' ')
              | regex_findall('https://[a-z0-9.]*download[.]nomachine[.]com/download/[0-9.]+/Linux/' + nomachine_pkg_regex)
              | first | default('')) }}

    - name: Fail if no download link was found
      ansible.builtin.fail:
        msg: >-
          Couldn't find a NoMachine {{ nomachine_pkg_ext }} for {{ ansible_architecture }} on nomachine.com.
          Set nomachine_url in vars/apps.yml to a direct package link.
      when: nomachine_pkg_url | length == 0

    - name: Install NoMachine (RPM)
      ansible.builtin.dnf:
        name: "{{ nomachine_pkg_url }}"
        state: present
        disable_gpg_check: true   # NoMachine doesn't sign its RPMs; fetched over HTTPS
      when: ansible_os_family == 'RedHat'

    - name: Install NoMachine (deb)
      ansible.builtin.apt:
        deb: "{{ nomachine_pkg_url }}"
      when: ansible_os_family == 'Debian'

- name: Check for firewalld
  ansible.builtin.service_facts:

- name: Open the NoMachine port in firewalld
  ansible.posix.firewalld:
    port: "{{ nomachine_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: ansible_facts.services['firewalld.service'].state | default('') == 'running'
