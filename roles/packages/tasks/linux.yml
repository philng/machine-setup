---
- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == 'Debian'

- name: Install packages
  ansible.builtin.package:
    name: "{{ packages_resolved }}"
    state: present
  when:
    - packages_resolved | length > 0
    - not ostree_booted | default(false)

# Fedora Atomic: layered with rpm-ostree. (Unwanted apps are removed by the
# rpm_ostree role at the end of the run.)
- name: Layer packages (Fedora Atomic)
  ansible.builtin.include_role:
    name: rpm_ostree
    tasks_from: install
  vars:
    rpm_ostree_install: "{{ packages_resolved }}"
  when:
    - packages_resolved | length > 0
    - ostree_booted | default(false)

# Only ask the package manager to remove what is actually installed, so
# names that don't exist on this distro are harmless. Shell-style globs like
# "libreoffice*" are expanded against the installed package list.
- name: Gather installed packages
  ansible.builtin.package_facts:
  when:
    - packages_remove_resolved | length > 0
    - not ostree_booted | default(false)

- name: Work out which unwanted packages are installed
  ansible.builtin.set_fact:
    packages_to_remove: >-
      {{ packages_to_remove | default([])
         + (ansible_facts.packages.keys()
            | select('match', '^' + glob_regex + '$')
            | list) }}
  loop: "{{ packages_remove_resolved }}"
  when: not ostree_booted | default(false)
  vars:
    # Package names only use letters, digits and . + - _ so this is enough
    # to turn a glob into a regex.
    glob_regex: "{{ item | replace('.', '[.]') | replace('+', '[+]') | replace('*', '.*') | replace('?', '.') }}"

# allowerasing also removes installed packages that need the unwanted ones
# (e.g. unoconv needs LibreOffice, the installer's anaconda-webui needs
# Firefox), like `dnf remove` does; without it dnf refuses.
- name: Remove unwanted packages (dnf)
  ansible.builtin.dnf:
    name: "{{ packages_to_remove | unique }}"
    state: absent
    allowerasing: true
  when:
    - ansible_facts.os_family == 'RedHat'
    - packages_to_remove | default([]) | length > 0

- name: Remove unwanted packages
  ansible.builtin.package:
    name: "{{ packages_to_remove | unique }}"
    state: absent
  when:
    - ansible_facts.os_family != 'RedHat'
    - packages_to_remove | default([]) | length > 0

- name: Enable and start services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ services_enabled }}"

# On Fedora Atomic, groups from layered packages (e.g. docker) live in
# /usr/lib/group, which usermod doesn't read; copy them into /etc/group.
- name: Copy package groups into /etc/group (Fedora Atomic)
  ansible.builtin.shell: >-
    grep -q '^{{ item }}:' /etc/group && exit 0;
    line=$(grep '^{{ item }}:' /usr/lib/group) || exit 0;
    echo "$line" >> /etc/group && echo added
  register: group_copied
  changed_when: "'added' in group_copied.stdout"
  loop: "{{ user_groups }}"
  when: ostree_booted | default(false)

- name: Add extra groups for {{ target_user }}
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: "{{ user_groups }}"
    append: true
  when: user_groups | length > 0
