---
- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Install packages
  ansible.builtin.package:
    name: "{{ packages_resolved }}"
    state: present
  when: packages_resolved | length > 0

# Only ask the package manager to remove what is actually installed, so
# names that don't exist on this distro are harmless. Shell-style globs like
# "libreoffice*" are expanded against the installed package list.
- name: Gather installed packages
  ansible.builtin.package_facts:
  when: packages_remove_resolved | length > 0

- name: Work out which unwanted packages are installed
  ansible.builtin.set_fact:
    packages_to_remove: >-
      {{ packages_to_remove | default([])
         + (ansible_facts.packages.keys()
            | select('match', '^' + glob_regex + '$')
            | list) }}
  loop: "{{ packages_remove_resolved }}"
  vars:
    # Package names only use letters, digits and . + - _ so this is enough
    # to turn a glob into a regex.
    glob_regex: "{{ item | replace('.', '[.]') | replace('+', '[+]') | replace('*', '.*') | replace('?', '.') }}"

- name: Remove unwanted packages
  ansible.builtin.package:
    name: "{{ packages_to_remove | unique }}"
    state: absent
  when: packages_to_remove | default([]) | length > 0

- name: Enable and start services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ services_enabled }}"

- name: Add extra groups for {{ target_user }}
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: "{{ user_groups }}"
    append: true
  when: user_groups | length > 0
