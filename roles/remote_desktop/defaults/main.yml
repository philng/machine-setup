---
remote_desktop_enabled: false
# wayvnc's port. The image's firewall only lets your tailnet reach it
# (bootc/files/etc/firewalld/zones/tailscale.xml).
remote_desktop_vnc_port: 5900
# Log in to Sway automatically at boot (and lock the screen straight away), so
# VNC has a session to show without logging in at the machine first.
remote_desktop_autologin: false
