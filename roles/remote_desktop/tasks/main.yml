---
# GNOME Remote Login: RDP into this machine's login screen with nobody
# logged in (GNOME 46+). Connect with any RDP client. The RDP user name and
# password are separate from your account's and are set once by hand:
#   sudo grdctl --system rdp set-credentials <user> <password>
# (or Settings > System > Remote Desktop > Remote Login).
# RDP is only reachable over Tailscale (see remote_desktop_allowed_sources).
- name: Install GNOME Remote Desktop
  ansible.builtin.dnf:
    name: [gnome-remote-desktop, openssl]
    state: present

- name: Create the certificate folder
  ansible.builtin.file:
    path: "{{ remote_desktop_tls_dir }}"
    state: directory
    owner: gnome-remote-desktop
    group: gnome-remote-desktop
    mode: "0700"

- name: Create a self-signed TLS certificate for RDP
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey rsa:4096 -nodes -sha256 -days 3650
      -subj /CN={{ ansible_facts.hostname }}
      -keyout {{ remote_desktop_tls_dir }}/rdp-tls.key
      -out {{ remote_desktop_tls_dir }}/rdp-tls.crt
    creates: "{{ remote_desktop_tls_dir }}/rdp-tls.crt"

- name: Let the remote desktop service read the certificate
  ansible.builtin.file:
    path: "{{ remote_desktop_tls_dir }}/{{ item }}"
    owner: gnome-remote-desktop
    group: gnome-remote-desktop
    mode: "0600"
  loop: [rdp-tls.key, rdp-tls.crt]
  when: not ansible_check_mode

- name: Start the remote desktop service
  ansible.builtin.systemd_service:
    name: gnome-remote-desktop
    enabled: true
    state: started

- name: Read the Remote Login settings
  ansible.builtin.command: grdctl --system status
  register: grd_status
  changed_when: false
  failed_when: false
  check_mode: false   # read-only; also runs in --dry-run

- name: Use the certificate
  ansible.builtin.command: grdctl --system rdp set-tls-{{ item.kind }} {{ remote_desktop_tls_dir }}/{{ item.file }}
  loop:
    - { kind: cert, file: rdp-tls.crt }
    - { kind: key, file: rdp-tls.key }
  when: (remote_desktop_tls_dir + '/' + item.file) not in grd_status.stdout | default('')
  changed_when: true
  notify: Restart gnome-remote-desktop

- name: Turn on Remote Login
  ansible.builtin.command: grdctl --system rdp enable
  when: grd_status.stdout | default('') is not search('RDP:\s*\n\s*Status:\s*enabled')
  changed_when: true
  notify: Restart gnome-remote-desktop

# The service only picks up the settings above when it (re)starts.
- name: Apply the Remote Login settings
  ansible.builtin.meta: flush_handlers

- name: Check that RDP is listening
  ansible.builtin.command: ss -Htln sport = :{{ remote_desktop_port }}
  register: grd_listening
  changed_when: false
  check_mode: false   # read-only; also runs in --dry-run

- name: Restart the remote desktop service if it isn't listening
  ansible.builtin.systemd_service:
    name: gnome-remote-desktop
    state: restarted
  when: grd_listening.stdout | trim | length == 0

- name: Check for firewalld
  ansible.builtin.service_facts:

- name: Open the RDP port in firewalld
  when: ansible_facts.services['firewalld.service'].state | default('') == 'running'
  block:
    # Not to everyone: only the sources below.
    - name: Close the RDP port to everyone
      ansible.posix.firewalld:
        port: "{{ remote_desktop_port }}/tcp"
        permanent: true
        immediate: true
        state: disabled

    - name: Open the RDP port to the allowed sources only
      ansible.posix.firewalld:
        rich_rule: >-
          rule family="{{ 'ipv6' if ':' in item else 'ipv4' }}" source address="{{ item }}"
          port port="{{ remote_desktop_port }}" protocol="tcp" accept
        permanent: true
        immediate: true
        state: "{{ 'enabled' if item in remote_desktop_allowed_sources else 'disabled' }}"
      loop: "{{ remote_desktop_known_sources | union(remote_desktop_allowed_sources) }}"
