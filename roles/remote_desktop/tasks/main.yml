---
# Remote desktop, reachable over Tailscale only (remote_desktop_allowed_sources):
#   GNOME: Remote Login over RDP, into the login screen (gnome.yml).
#   Sway:  wayvnc over VNC, into your running Sway session (wayvnc.yml).
- name: Check for Sway
  ansible.builtin.stat:
    path: /usr/bin/sway
  register: rd_sway

- name: Pick RDP (GNOME) or VNC (Sway)
  ansible.builtin.set_fact:
    rd_kind: "{{ 'vnc' if non_gnome_desktop | default(false) | bool and rd_sway.stat.exists else 'rdp' }}"

- name: Say why remote desktop was skipped
  ansible.builtin.debug:
    msg: Remote desktop is only set up for GNOME (RDP) and Sway (VNC); skipped on this desktop.
  when:
    - non_gnome_desktop | default(false) | bool
    - not rd_sway.stat.exists

- name: Set up GNOME Remote Login (RDP)
  ansible.builtin.include_tasks: gnome.yml
  when: not non_gnome_desktop | default(false) | bool

- name: Set up wayvnc (Sway)
  ansible.builtin.include_tasks: wayvnc.yml
  when: rd_kind == 'vnc'

- name: Pick the port
  ansible.builtin.set_fact:
    rd_port: "{{ remote_desktop_vnc_port if rd_kind == 'vnc' else remote_desktop_port }}"

- name: Check for firewalld
  ansible.builtin.service_facts:

- name: Open the remote desktop port in firewalld
  when:
    - ansible_facts.services['firewalld.service'].state | default('') == 'running'
    - not (non_gnome_desktop | default(false) | bool and not rd_sway.stat.exists)
  block:
    # Not to everyone: only the sources below.
    - name: Close the remote desktop port to everyone
      ansible.posix.firewalld:
        port: "{{ rd_port }}/tcp"
        permanent: true
        immediate: true
        state: disabled

    - name: Open the remote desktop port to the allowed sources only
      ansible.posix.firewalld:
        rich_rule: >-
          rule family="{{ 'ipv6' if ':' in item else 'ipv4' }}" source address="{{ item }}"
          port port="{{ rd_port }}" protocol="tcp" accept
        permanent: true
        immediate: true
        state: "{{ 'enabled' if item in remote_desktop_allowed_sources else 'disabled' }}"
      loop: "{{ remote_desktop_known_sources | union(remote_desktop_allowed_sources) }}"
