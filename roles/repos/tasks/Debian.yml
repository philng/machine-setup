---
# Debian and Ubuntu.

- name: RPM Fusion has no Debian equivalent
  ansible.builtin.debug:
    msg: "Skipping rpmfusion on {{ ansible_facts.distribution }} (enable contrib/non-free or multiverse instead)."
  when: "'rpmfusion' in extra_repos"

- name: Ghostty has no official Debian/Ubuntu repo
  ansible.builtin.debug:
    msg: "Skipping ghostty on {{ ansible_facts.distribution }}; see https://ghostty.org/docs/install/binary"
  when: "'ghostty' in extra_repos"

- name: Install python3-debian (needed by deb822_repository)
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: extra_repos | intersect(['vscode', 'docker']) | length > 0

- name: VS Code repo
  ansible.builtin.deb822_repository:
    name: vscode
    types: deb
    uris: https://packages.microsoft.com/repos/code
    suites: stable
    components: main
    architectures: [amd64, arm64]
    signed_by: https://packages.microsoft.com/keys/microsoft.asc
  register: vscode_repo
  when: "'vscode' in extra_repos"

- name: Docker CE repo
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    signed_by: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
  register: docker_repo
  when: "'docker' in extra_repos"

- name: Refresh apt cache after adding repos
  ansible.builtin.apt:
    update_cache: true
  when: (vscode_repo is changed) or (docker_repo is changed)
