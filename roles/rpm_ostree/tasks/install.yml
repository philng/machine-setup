---
# Layer packages onto Fedora Atomic (Silverblue, Sway Atomic, ...):
#   - ansible.builtin.include_role: { name: rpm_ostree, tasks_from: install }
#     vars: { rpm_ostree_install: [pkg, ...] }
# New packages are applied live, so they work straight away, unless something
# else (an OS update or a removal) is already waiting for a reboot. Then they
# are queued for the next boot and the run stops with a note to reboot and run
# again, since later steps need them.
- name: List installed packages  # noqa: command-instead-of-module
  ansible.builtin.command: rpm -qa --queryformat '%{NAME}\n'
  register: rpm_ostree_rpms
  changed_when: false
  check_mode: false   # read-only; also runs in --dry-run

- name: Read the rpm-ostree status
  ansible.builtin.command: rpm-ostree status --json
  register: rpm_ostree_status
  changed_when: false
  check_mode: false

# deployments[0] is what the next boot uses. Live updates only work when it
# differs from the running system by added packages alone.
- name: Work out what to layer
  ansible.builtin.set_fact:
    rpm_ostree_missing: "{{ rpm_ostree_install | reject('in', rpm_ostree_rpms.stdout_lines) | list }}"
    rpm_ostree_live_ok: >-
      {{ next_boot.booted
         or ((next_boot['base-checksum'] | default(next_boot.checksum)) == (booted['base-checksum'] | default(booted.checksum))
             and next_boot['requested-base-removals'] | default([]) | sort == booted['requested-base-removals'] | default([]) | sort
             and next_boot['base-local-replacements'] | default([]) | length == booted['base-local-replacements'] | default([]) | length
             and next_boot['base-remote-replacements'] | default({}) == booted['base-remote-replacements'] | default({})) }}
  vars:
    deployments: "{{ (rpm_ostree_status.stdout | from_json).deployments }}"
    next_boot: "{{ deployments | first }}"
    booted: "{{ deployments | selectattr('booted') | first }}"

- name: Layer {{ rpm_ostree_missing | map('basename') | join(', ') }}
  ansible.builtin.command:
    argv: >-
      {{ ['rpm-ostree', 'install', '--assumeyes', '--idempotent', '--allow-inactive', '--unchanged-exit-77']
         + (['--apply-live'] if rpm_ostree_live_ok | bool else [])
         + rpm_ostree_missing }}
  register: rpm_ostree_layered
  changed_when: rpm_ostree_layered.rc == 0
  failed_when: rpm_ostree_layered.rc not in [0, 77]
  when: rpm_ostree_missing | length > 0

- name: Check the new packages are usable now  # noqa: command-instead-of-module
  ansible.builtin.command: rpm -q {{ rpm_ostree_missing | reject('search', '://') | join(' ') }}
  register: rpm_ostree_live
  changed_when: false
  failed_when: false
  check_mode: false
  when: rpm_ostree_missing | reject('search', '://') | length > 0

- name: Let systemd see services from the new packages  # noqa: no-handler
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: rpm_ostree_layered is changed

- name: Stop here until the packages are installed
  when:
    - not ansible_check_mode
    - rpm_ostree_live.rc | default(0) != 0
  block:
    - name: Say what to do
      ansible.builtin.debug:
        msg:
          - "{{ rpm_ostree_missing | join(', ') }} will be installed when you restart,"
          - "because an update or a removal is already waiting for a restart."
          - "Restart (systemctl reboot), then run ./bootstrap.sh again to finish."

    - name: Stop
      ansible.builtin.meta: end_host
