---
# Fedora Atomic: remove unwanted apps that come with the image
# (rpm-ostree override remove). Runs last: removals only take effect after a
# restart, and while one is waiting, new packages can't be applied live.
- name: List installed packages  # noqa: command-instead-of-module
  ansible.builtin.command: rpm -qa --queryformat '%{NAME}\n'
  register: rpm_ostree_rpms
  changed_when: false
  check_mode: false   # read-only; also runs in --dry-run

- name: Read the rpm-ostree status
  ansible.builtin.command: rpm-ostree status --json
  register: rpm_ostree_status
  changed_when: false
  check_mode: false

# Shell-style globs ("firefox*") are matched against the installed packages;
# ones already queued for removal are left out.
- name: Work out which unwanted packages are installed
  ansible.builtin.set_fact:
    rpm_ostree_to_remove: >-
      {{ rpm_ostree_rpms.stdout_lines
         | select('match', '^(' + (rpm_ostree_remove | map('regex_replace', '([.+])', '[\1]')
                                     | map('replace', '*', '.*') | map('replace', '?', '.') | join('|')) + ')$')
         | difference(next_boot['requested-base-removals'] | default([]))
         | difference(next_boot['requested-packages'] | default([]))
         | list }}
  vars:
    next_boot: "{{ (rpm_ostree_status.stdout | from_json).deployments | first }}"
  when: rpm_ostree_remove | length > 0

- name: Remove {{ rpm_ostree_to_remove | default([]) | join(', ') }}
  ansible.builtin.command:
    argv: "{{ ['rpm-ostree', 'override', 'remove'] + rpm_ostree_to_remove }}"
  changed_when: true
  when: rpm_ostree_to_remove | default([]) | length > 0

- name: Check whether a restart is needed
  ansible.builtin.command: rpm-ostree status --json
  register: rpm_ostree_status
  changed_when: false
  check_mode: false

- name: Say a restart is needed
  ansible.builtin.debug:
    msg: "Restart (systemctl reboot) to finish: some changes take effect on the next boot."
  when: not ((rpm_ostree_status.stdout | from_json).deployments | first).booted
