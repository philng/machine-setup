---
# RustDesk (remote desktop, open source) is installed from its GitHub
# releases on Linux. The package includes a systemd service, so this machine
# can be reached by its RustDesk ID. On macOS it is the "rustdesk" cask
# (see casks in vars/apps.yml).
- name: Check whether RustDesk is installed
  ansible.builtin.package_facts:

- name: Find and install RustDesk
  when: "'rustdesk' not in ansible_facts.packages"
  block:
    # github.com/<repo>/releases/latest redirects to the newest tag, which
    # avoids the GitHub API and its rate limit.
    - name: Look up the latest RustDesk release
      ansible.builtin.uri:
        url: "{{ rustdesk_repo }}/releases/latest"
        method: HEAD
        follow_redirects: none
        status_code: [301, 302]
      register: rustdesk_latest
      failed_when: false
      check_mode: false
      when:
        - rustdesk_url | length == 0
        - rustdesk_version | length == 0

    - name: Build the package link
      vars:
        rd_version: >-
          {{ rustdesk_version if rustdesk_version | length > 0 else
             (rustdesk_latest.location | default('') | regex_replace('^.*/tag/v?', '')) }}
        rd_arch: "{{ ansible_architecture }}"
        rd_file: >-
          {{ 'rustdesk-' + rd_version + '-0.' + rd_arch + '.rpm' if ansible_os_family == 'RedHat'
             else 'rustdesk-' + rd_version + '-' + rd_arch + '.deb' }}
      ansible.builtin.set_fact:
        rustdesk_pkg_url: >-
          {{ rustdesk_url if rustdesk_url | length > 0 else
             (rustdesk_repo + '/releases/download/' + rd_version + '/' + rd_file
              if rd_version | length > 0 else '') }}

    - name: Warn that RustDesk couldn't be found
      ansible.builtin.debug:
        msg:
          - "Couldn't find the latest RustDesk release, so RustDesk was skipped."
          - "Set rustdesk_version or rustdesk_url in vars/apps.yml and re-run."
          - "Release lookup status: {{ rustdesk_latest.status | default('skipped') }}"
      when: rustdesk_pkg_url | trim | length == 0

    - name: Install RustDesk
      when: rustdesk_pkg_url | trim | length > 0
      block:
        - name: Install RustDesk (RPM)
          ansible.builtin.dnf:
            name: "{{ rustdesk_pkg_url | trim }}"
            state: present
            disable_gpg_check: true   # RustDesk doesn't sign its RPMs; fetched over HTTPS
          when: ansible_os_family == 'RedHat'

        - name: Install RustDesk (deb)
          ansible.builtin.apt:
            deb: "{{ rustdesk_pkg_url | trim }}"
          when: ansible_os_family == 'Debian'
      rescue:
        - name: Warn that RustDesk failed to install
          ansible.builtin.debug:
            msg:
              - "Installing RustDesk from {{ rustdesk_pkg_url | trim }} failed, so it was skipped:"
              - "{{ ansible_failed_result.msg | default('') }}"
              - "Set rustdesk_version or rustdesk_url in vars/apps.yml and re-run."

- name: Check whether the RustDesk service exists
  ansible.builtin.service_facts:

# Lets you connect to this machine by its RustDesk ID without anyone at it.
- name: Start the RustDesk service
  ansible.builtin.systemd_service:
    name: rustdesk
    enabled: true
    state: started
  when: "'rustdesk.service' in ansible_facts.services"
