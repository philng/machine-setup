---
# Hardening for the server profile: SSH keys, key-only SSH, fail2ban and a
# firewall that only lets SSH in.

- name: Make sure the SSH server is installed and running
  block:
    - name: Install openssh-server
      ansible.builtin.dnf:
        name: openssh-server
        state: present

    - name: Start sshd at boot
      ansible.builtin.systemd_service:
        name: sshd
        enabled: true
        state: started

- name: Authorise your SSH keys
  when: server_ssh_keys_url | length > 0
  block:
    - name: Fetch your public keys
      ansible.builtin.uri:
        url: "{{ server_ssh_keys_url }}"
        return_content: true
      register: server_keys
      failed_when: false

    - name: Add them to ~/.ssh/authorized_keys
      ansible.posix.authorized_key:
        user: "{{ target_user }}"
        key: "{{ item }}"
        state: present
      loop: "{{ server_keys.content | default('') | split('\n') | map('trim') | select('match', '^(ssh|ecdsa|sk)-') | list }}"
      loop_control:
        label: "{{ item.split(' ')[:2] | join(' ') | truncate(40) }}"
      when: server_keys.status | default(0) == 200

- name: Count authorised keys
  ansible.builtin.shell: >-
    set -o pipefail;
    grep -cE '^(ssh|ecdsa|sk)-' ~{{ target_user }}/.ssh/authorized_keys 2>/dev/null || true
  args:
    executable: /bin/bash
  register: server_key_count
  changed_when: false

- name: Warn when no SSH key is authorised
  ansible.builtin.debug:
    msg:
      - "WARNING: no SSH keys in ~{{ target_user }}/.ssh/authorized_keys, and password logins are now OFF."
      - "Keep this session open and add a key (upload one to GitHub and re-run, or paste it into"
      - "~/.ssh/authorized_keys), or you'll only be able to log in at the console."
  when: (server_key_count.stdout | int) == 0

- name: Configure sshd
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/10-machine-setup.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Firewall
  block:
    - name: Start firewalld
      ansible.builtin.systemd_service:
        name: firewalld
        enabled: true
        state: started

    - name: List open services
      ansible.builtin.command: firewall-cmd --permanent --list-services
      register: server_fw_services
      changed_when: false

    - name: Open the allowed services
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ server_firewall_services }}"

    - name: Close everything else
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: disabled
      loop: "{{ server_fw_services.stdout.split() | difference(server_firewall_services) }}"

- name: Fail2ban
  when: server_fail2ban | bool
  block:
    - name: Configure fail2ban for SSH
      ansible.builtin.template:
        src: jail.local.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: "0644"
      notify: Restart fail2ban

    - name: Start fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        enabled: true
        state: started
