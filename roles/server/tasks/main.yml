---
# Server profile: your SSH keys. Key-only SSH, fail2ban and the firewall come
# with the server image (bootc/server).

- name: Authorise your SSH keys
  when: server_ssh_keys_url | length > 0
  block:
    - name: Fetch your public keys
      ansible.builtin.uri:
        url: "{{ server_ssh_keys_url }}"
        return_content: true
      register: server_keys
      failed_when: false

    - name: Add them to ~/.ssh/authorized_keys
      ansible.posix.authorized_key:
        user: "{{ target_user }}"
        key: "{{ item }}"
        state: present
      loop: "{{ server_keys.content | default('') | split('\n') | map('trim') | select('match', '^(ssh|ecdsa|sk)-') | list }}"
      loop_control:
        label: "{{ item.split(' ')[:2] | join(' ') | truncate(40) }}"
      when: server_keys.status | default(0) == 200

- name: Count authorised keys
  ansible.builtin.shell: >-
    set -o pipefail;
    grep -cE '^(ssh|ecdsa|sk)-' ~{{ target_user }}/.ssh/authorized_keys 2>/dev/null || true
  args:
    executable: /bin/bash
  register: server_key_count
  changed_when: false
  check_mode: false   # read-only; also runs in --dry-run

- name: Warn when no SSH key is authorised
  ansible.builtin.debug:
    msg:
      - "WARNING: no SSH keys in ~{{ target_user }}/.ssh/authorized_keys, and password logins are OFF."
      - "Keep this session open and add a key (upload one to GitHub and re-run, or paste it into"
      - "~/.ssh/authorized_keys), or you'll only be able to log in at the console."
  when: (server_key_count.stdout | int) == 0
