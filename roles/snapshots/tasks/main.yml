---
# Btrfs snapshots of / before and after every dnf transaction (Fedora), so a
# bad update can be rolled back. Skipped unless / is btrfs.
- name: Check that / is btrfs
  ansible.builtin.set_fact:
    snapshots_root_btrfs: "{{ ansible_facts.mounts | selectattr('mount', 'equalto', '/') | map(attribute='fstype') | first | default('') == 'btrfs' }}"

- name: Snapshots with snapper
  when: snapshots_root_btrfs | bool
  block:
    - name: Install snapper and the dnf5 actions plugin
      ansible.builtin.dnf:
        name:
          - snapper
          - libdnf5-plugin-actions
        state: present

    - name: Check for a snapper config for /
      ansible.builtin.stat:
        path: /etc/snapper/configs/root
      register: snapper_root_config

    - name: Create a snapper config for /
      ansible.builtin.command: snapper -c root create-config /
      when: not snapper_root_config.stat.exists
      changed_when: true

    - name: Keep a few numbered snapshots, no hourly ones
      ansible.builtin.lineinfile:
        path: /etc/snapper/configs/root
        regexp: "^{{ item.key }}="
        line: '{{ item.key }}="{{ item.value }}"'
      loop:
        - { key: TIMELINE_CREATE, value: "no" }
        - { key: NUMBER_CLEANUP, value: "yes" }
        - { key: NUMBER_LIMIT, value: "{{ snapshots_keep }}" }
        - { key: NUMBER_LIMIT_IMPORTANT, value: "{{ snapshots_keep }}" }

    - name: Snapshot before and after every dnf transaction
      ansible.builtin.copy:
        src: snapper.actions
        dest: /etc/dnf/libdnf5-plugins/actions.d/snapper.actions
        owner: root
        group: root
        mode: "0644"

    - name: Clean up old snapshots daily
      ansible.builtin.systemd_service:
        name: snapper-cleanup.timer
        enabled: true
        state: started

- name: Say why snapshots were skipped
  ansible.builtin.debug:
    msg: "/ isn't btrfs, so update snapshots were skipped."
  when: not snapshots_root_btrfs | bool
