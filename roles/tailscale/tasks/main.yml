---
# Tailscale comes with the image (tailscaled running); this joins the tailnet
# with tailscale_authkey if one is set. Otherwise run `sudo tailscale up` once.
# (macOS: the tailscale-app cask; Windows: winget.)
- name: Check whether this machine is in a tailnet
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false   # read-only; also runs in --dry-run

- name: Join the tailnet with the auth key
  ansible.builtin.command:
    argv: "{{ ['tailscale', 'up', '--authkey', tailscale_authkey] + tailscale_up_args }}"
  no_log: true
  changed_when: true
  when:
    - tailscale_authkey | length > 0
    - (tailscale_status.stdout | default('{}') | from_json).BackendState | default('') != 'Running'
