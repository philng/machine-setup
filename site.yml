---
# Set up this machine. Safe to re-run.
#   ansible-playbook site.yml -K                  # everything (desktop profile)
#   ansible-playbook site.yml -K -e profile=server              # server profile
#   ansible-playbook site.yml -K --tags flatpak   # one part
#   ansible-playbook site.yml -K --check --diff   # dry run
- name: Set up workstation
  hosts: local
  # Hardware facts take over a minute on macOS (system_profiler) and nothing
  # needs them.
  gather_subset: ['!hardware']
  vars_files:
    - vars/apps.yml
  vars:
    # The user who ran the playbook (lookups run before privilege escalation).
    target_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
    # Linux needs root for Flatpaks and system settings. Homebrew refuses to run as root.
    # (Set per role because facts aren't known yet at the play level.)
    use_sudo: "{{ ansible_facts.os_family != 'Darwin' }}"
    # "desktop" (default) or "server" (see vars/server.yml).
    profile: desktop

  pre_tasks:
    - name: Check the profile
      ansible.builtin.assert:
        that:
          - profile in ['desktop', 'server']
          - profile == 'desktop' or ansible_facts.os_family != 'Darwin'
        fail_msg: "profile must be desktop or server (server is for Linux)."
        quiet: true
      tags: always

    # On Linux this runs on Fedora Sway Atomic with this repo's image
    # (bootc/), which brings the packages and system settings.
    - name: Check for Fedora Atomic
      ansible.builtin.stat:
        path: /run/ostree-booted
      register: ostree_booted
      tags: always

    - name: Check this is Fedora Sway Atomic (or macOS)
      ansible.builtin.assert:
        that: ansible_facts.os_family == 'Darwin' or ostree_booted.stat.exists
        fail_msg: >-
          On Linux this setup is for Fedora Sway Atomic. Install it, then run ./bootstrap.sh,
          which switches the machine to this repo's image.
        quiet: true
      tags: always

    - name: Check for Sway
      ansible.builtin.stat:
        path: /usr/bin/sway
      register: sway_bin
      tags: always

    # The server profile also runs headless (machine_gui=false skips the desktop apps).
    - name: Work out whether this machine has a GUI
      ansible.builtin.set_fact:
        machine_gui: >-
          {{ true if profile == 'desktop' or ansible_facts.os_family == 'Darwin'
             else (machine_gui | bool if machine_gui is defined else sway_bin.stat.exists) }}
      tags: always

    - name: Load the server profile
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/server.yml"
      when: profile == 'server'
      tags: always

    - name: Load personal settings (vars/local.yml, written by bootstrap.sh; overrides everything above)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/local.yml"
      when: lookup('ansible.builtin.fileglob', playbook_dir + '/vars/local.yml') | length > 0
      tags: always

    - name: Show detected OS and profile
      ansible.builtin.debug:
        msg: >-
          {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }},
          {{ profile }} profile, {{ 'GUI' if machine_gui | bool else 'headless' }}
      tags: always

  roles:
    - role: packages      # Homebrew formulae and taps (macOS)
      tags: packages
      when: ansible_facts.os_family == 'Darwin'
    - role: casks         # GUI apps (macOS)
      become: "{{ use_sudo }}"
      tags: casks
      when: ansible_facts.os_family == 'Darwin'
    - role: macos         # dark mode, Dock, key repeat, Finder (macOS)
      tags: macos
      when: ansible_facts.os_family == 'Darwin'
    - role: flatpak       # GUI apps from Flathub (Linux)
      become: "{{ use_sudo }}"
      tags: flatpak
      when:
        - ansible_facts.os_family != 'Darwin'
        - machine_gui | bool
    - role: tailscale     # join the tailnet with an auth key, if set (Linux)
      become: "{{ use_sudo }}"
      tags: tailscale
      when:
        - ansible_facts.os_family != 'Darwin'
        - tailscale_authkey | default('') | length > 0
    - role: remote_desktop   # wayvnc in your Sway session (Linux)
      become: "{{ use_sudo }}"
      tags: remote_desktop
      when:
        - ansible_facts.os_family != 'Darwin'
        - remote_desktop_enabled | bool
        - sway_bin.stat.exists
    - role: jetbrains_toolbox   # JetBrains Toolbox from jetbrains.com (Linux)
      tags: jetbrains
      when:
        - ansible_facts.os_family != 'Darwin'
        - jetbrains_toolbox_enabled | bool
        - machine_gui | bool
    - role: dotfiles      # your dotfiles repo, linked into ~ (before vim/ghostty/zsh,
      tags: dotfiles      # whose starter configs are only written if missing)
      when:
        - dotfiles_enabled | bool
        - dotfiles_repo | length > 0
        - dotfiles_repo is not search('github.com//')   # github_user not set
    - role: vim           # vim-plug + starter ~/.vimrc (after dotfiles)
      tags: vim
      when: vim_enabled | bool
    - role: ghostty       # starter config with the Catppuccin Mocha theme
      tags: ghostty
      when:
        - ghostty_theme | default('') | length > 0
        - machine_gui | bool
    - role: mise          # mise + uv
      tags: mise
      when: mise_enabled | bool
    - role: claude_code   # Claude Code CLI, native installer
      tags: claude
      when: claude_code_enabled | bool
    - role: git_setup     # ~/.gitconfig, delta, gh logins, SSH key
      tags: git
    - role: zsh           # antidote + zsh as login shell (after dotfiles)
      tags: zsh
      when: zsh_enabled | bool
    - role: server        # your SSH keys (server profile)
      become: "{{ use_sudo }}"
      tags: server
      when: profile == 'server'
