---
# Set up this machine. Safe to re-run.
#   ansible-playbook site.yml -K                  # everything (desktop profile)
#   ansible-playbook site.yml -K -e profile=server              # Fedora Server
#   ansible-playbook site.yml -K -e profile=server -e machine_gui=false
#   ansible-playbook site.yml -K --tags flatpak   # one part
#   ansible-playbook site.yml -K --check --diff   # dry run
- name: Set up workstation
  hosts: local
  # Hardware facts take over a minute on macOS (system_profiler) and nothing
  # needs them; the snapshots role gathers mounts itself.
  gather_subset: ['!hardware']
  vars_files:
    - vars/apps.yml
  vars:
    # The user who ran the playbook (lookups run before privilege escalation).
    target_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
    # Linux needs root for dnf/apt/flatpak. Homebrew refuses to run as root.
    # (Set per role because facts aren't known yet at the play level.)
    use_sudo: "{{ ansible_facts.os_family != 'Darwin' }}"
    # "desktop" (default) or "server" (see vars/server.yml).
    profile: desktop

  pre_tasks:
    - name: Check the profile
      ansible.builtin.assert:
        that:
          - profile in ['desktop', 'server']
          - profile == 'desktop' or ansible_facts.distribution == 'Fedora'
        fail_msg: "profile must be desktop or server, and the server profile is for Fedora Server."
        quiet: true
      tags: always

    # Fedora Atomic (Silverblue, Sway Atomic, ...) has a read-only /usr:
    # packages are layered with rpm-ostree instead of installed with dnf.
    - name: Check for Fedora Atomic
      ansible.builtin.stat:
        path: /run/ostree-booted
      register: ostree_booted_file
      tags: always

    - name: Note whether this is Fedora Atomic
      ansible.builtin.set_fact:
        ostree_booted: "{{ ostree_booted_file.stat.exists }}"
      tags: always

    - name: Check the server profile isn't used on Fedora Atomic
      ansible.builtin.assert:
        that: profile == 'desktop' or not ostree_booted
        fail_msg: "The server profile is for Fedora Server; use the desktop profile on Fedora Atomic."
        quiet: true
      tags: always

    - name: Check for a desktop
      ansible.builtin.stat:
        path: /usr/bin/gnome-shell
      register: gnome_shell
      tags: always

    - name: Check for other desktops (Sway, KDE)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/usr/bin/sway, /usr/bin/startplasma-wayland]
      register: other_desktops
      tags: always

    # Desktops always have a GUI. Servers: --gui/--headless, else auto-detect.
    - name: Work out whether this machine has a GUI
      ansible.builtin.set_fact:
        machine_gui: >-
          {{ true if profile == 'desktop' or ansible_facts.os_family == 'Darwin'
             else (machine_gui | bool if machine_gui is defined else gnome_shell.stat.exists) }}
        # GNOME-only parts (Remote Login, tray icons, Google Drive in Files)
        # are skipped on other desktops such as Sway.
        non_gnome_desktop: >-
          {{ not gnome_shell.stat.exists
             and other_desktops.results | selectattr('stat.exists') | list | length > 0 }}
      tags: always

    - name: Load the server profile
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/server.yml"
      when: profile == 'server'
      tags: always

    - name: Load personal settings (vars/local.yml, written by bootstrap.sh; overrides everything above)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/local.yml"
      when: lookup('ansible.builtin.fileglob', playbook_dir + '/vars/local.yml') | length > 0
      tags: always

    - name: Show detected OS and profile
      ansible.builtin.debug:
        msg: >-
          {{ ansible_facts.distribution }} {{ 'Atomic ' if ostree_booted else '' }}{{ ansible_facts.distribution_version }} ({{ ansible_facts.os_family }}),
          {{ profile }} profile, {{ 'GUI' if machine_gui | bool else 'headless' }}
      tags: always

  roles:
    - role: repos         # Linux repos, or Homebrew taps on macOS
      become: "{{ use_sudo }}"
      tags: repos
    - role: snapshots     # btrfs snapshots before/after every dnf update (Fedora)
      become: "{{ use_sudo }}"
      tags: snapshots
      when:
        - ansible_facts.distribution == 'Fedora'
        - not ostree_booted       # Atomic already keeps the previous version (rpm-ostree rollback)
        - snapshots_enabled | bool
    - role: packages      # dnf/apt on Linux, Homebrew formulae on macOS
      become: "{{ use_sudo }}"
      tags: packages
    - role: multimedia    # codecs + GPU drivers (Fedora, RPM Fusion)
      become: "{{ use_sudo }}"
      tags: multimedia
      when: multimedia_enabled | bool
    - role: flatpak       # GUI apps on Linux
      become: "{{ use_sudo }}"
      tags: flatpak
      when:
        - ansible_facts.os_family != 'Darwin'
        - machine_gui | bool
    - role: tailscale     # Tailscale VPN from its official repo (Linux)
      become: "{{ use_sudo }}"
      tags: tailscale
      when:
        - ansible_facts.os_family != 'Darwin'
        - tailscale_enabled | bool
    - role: remote_desktop   # GNOME Remote Login over RDP (Fedora)
      become: "{{ use_sudo }}"
      tags: remote_desktop
      when:
        - ansible_facts.os_family == 'RedHat'
        - remote_desktop_enabled | bool
        - machine_gui | bool
        - not non_gnome_desktop | bool
    - role: jetbrains_toolbox   # JetBrains Toolbox from jetbrains.com (Linux)
      tags: jetbrains
      when:
        - ansible_facts.os_family != 'Darwin'
        - jetbrains_toolbox_enabled | bool
        - machine_gui | bool
    - role: dotfiles      # your dotfiles repo, linked into ~ (before vim/ghostty/zsh,
      tags: dotfiles      # whose starter configs are only written if missing)
      when:
        - dotfiles_enabled | bool
        - dotfiles_repo | length > 0
        - dotfiles_repo is not search('github.com//')   # github_user not set
    - role: vim           # vim-plug + starter ~/.vimrc (after dotfiles)
      tags: vim
      when: vim_enabled | bool
    - role: ghostty       # starter config with the Catppuccin Mocha theme
      tags: ghostty
      when:
        - ghostty_theme | default('') | length > 0
        - machine_gui | bool
    - role: mise          # mise + uv (Linux and macOS)
      tags: mise
      when: mise_enabled | bool
    - role: claude_code   # Claude Code CLI, native installer (Linux and macOS)
      tags: claude
      when: claude_code_enabled | bool
    - role: fonts         # Nerd Fonts (Linux; casks on macOS)
      tags: fonts
      when:
        - ansible_facts.os_family != 'Darwin'
        - machine_gui | bool
    - role: casks         # GUI apps on macOS
      become: "{{ use_sudo }}"
      tags: casks
      when: ansible_facts.os_family == 'Darwin'
    - role: macos         # dark mode, Dock, key repeat, Finder (macOS)
      tags: macos
      when: ansible_facts.os_family == 'Darwin'
    - role: auto_updates  # dnf-automatic / unattended-upgrades + weekly Flatpak updates
      become: "{{ use_sudo }}"
      tags: updates
      when:
        - ansible_facts.os_family != 'Darwin'
        - auto_updates_enabled | bool
    - role: gnome         # GNOME settings (dark mode, ...)
      tags: gnome
      when:
        - ansible_facts.os_family != 'Darwin'
        - machine_gui | bool
        - not non_gnome_desktop | bool
    - role: git_setup     # ~/.gitconfig, delta, gh logins, SSH key
      tags: git
    - role: zsh           # antidote + zsh as login shell (after dotfiles)
      tags: zsh
      when: zsh_enabled | bool
    - role: server        # SSH keys + key-only SSH, fail2ban, firewall (server profile)
      become: "{{ use_sudo }}"
      tags: server
      when: profile == 'server'
    - role: rpm_ostree    # Fedora Atomic: remove unwanted apps from the image (last:
      become: "{{ use_sudo }}"   # takes effect after a restart)
      tags: packages
      when: ostree_booted | bool
      vars:
        rpm_ostree_remove: "{{ packages_remove }}"
