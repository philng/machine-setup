---
# Desktop profile (the default). The server profile overrides parts of this
# from vars/server.yml (./bootstrap.sh --profile server).
# The one file you normally edit.
#
# Linux (Fedora Sway Atomic): CLI tools, VS Code, Ghostty and Tailscale come with
# the image (bootc/packages/*.txt); GUI apps from Flathub.
# macOS: CLI tools are Homebrew formulae, GUI apps are Homebrew casks.

# ------------------------------------------------------ CLI tools (macOS)
# Homebrew formulae. (Linux: bootc/packages/common.txt.)
packages:
  - git                    # needed to update this repo
  - vim
  - gh                     # GitHub CLI
  - fzf                    # fuzzy finder (Ctrl+R history, Ctrl+T files)
  - bat                    # cat with highlighting
  - btop                   # system monitor
  - eza                    # nicer ls
  - git-delta              # nicer git diffs (configured by the git role)
  - podman                 # containers

# Homebrew formulae to make sure are NOT installed.
packages_remove: []

# ------------------------------------------------------- GUI apps (Linux)
# GUI apps from Flathub (use the app ID from flathub.org).
flatpaks:
  - com.google.Chrome
  - com.spotify.Client
  - org.videolan.VLC       # Media Player Classic is Windows-only
  - com.valvesoftware.Steam

# Also remove the Flatpak versions, in case they were installed that way.
flatpaks_remove:
  - org.chromium.Chromium
  - org.libreoffice.LibreOffice

# ------------------------------------------------------- GUI apps (macOS)
# Homebrew casks (names from formulae.brew.sh/cask).
casks:
  - google-chrome
  - tailscale-app
  - tigervnc-viewer        # VNC client for wayvnc on a Sway machine
  - spotify
  - vlc
  - steam
  - visual-studio-code
  - ghostty
  - jetbrains-toolbox      # then install IntelliJ IDEA from its window
  - claude                 # Claude desktop app
  - google-drive
  - font-jetbrains-mono-nerd-font

casks_remove:
  - chromium
  - libreoffice

# Preinstalled Apple apps to delete (paths). Built-in apps like Safari or Mail
# live on the read-only system volume and can't be removed.
mac_apps_remove:
  - /Applications/GarageBand.app
  - /Library/Application Support/GarageBand
  - /Library/Application Support/Logic
  - /Library/Audio/Apple Loops       # GarageBand's sound library (several GB)
  - /Applications/iMovie.app
  - /Applications/Pages.app
  - /Applications/Numbers.app
  - /Applications/Keynote.app

# Extra Homebrew taps, e.g. "homebrew/cask-fonts".
homebrew_taps: []

# ------------------------------------------------------ Tailscale (Linux)
# Comes with the image, running. Sign in once with `sudo tailscale up`, or put
# tailscale_authkey (and optionally tailscale_up_args) in vars/local.yml.
# (On macOS it's the tailscale-app cask above.)

# --------------------------------------------------- Remote desktop (Linux)
# wayvnc: VNC into your running Sway session (port 5900, Tailscale only).
# Connect with TigerVNC Viewer and your Linux user name and password.
# On by default for a server (vars/server.yml).
remote_desktop_enabled: false

# ----------------------------------------------- JetBrains Toolbox (Linux)
# Downloaded from jetbrains.com into ~/.local/share/JetBrains/Toolbox and
# self-updating. Install IntelliJ IDEA from its window on first launch.
jetbrains_toolbox_enabled: true

# --------------------------------------------------------------------- Git
# Written to ~/.gitconfig. Leave blank to skip. Also sets delta as the diff
# pager, gh for GitHub https logins, and creates ~/.ssh/id_ed25519 if missing.
git_user_name: ""
git_user_email: ""

# -------------------------------------------------------- mise + uv
# mise manages language versions per project (Node, Python, Java, Go...);
# uv manages Python packages and is installed through mise.
mise_enabled: true
mise_global_tools:
  - uv

# ------------------------------------------------------------- Claude Code
# Installed with Anthropic's native installer into ~/.local/bin (auto-updates).
# The Claude desktop app is the "claude" cask on macOS.
claude_code_enabled: true

# ------------------------------------------------------------------- Fonts
# Nerd Fonts for Linux, installed into ~/.local/share/fonts. Names are the
# archive names on github.com/ryanoasis/nerd-fonts/releases. On macOS add
# the font-*-nerd-font cask instead.
nerd_fonts:
  - JetBrainsMono

# ------------------------------------------------------------------- Shell
# zsh as your login shell, with the antidote plugin manager. Creates a
# starter ~/.zshrc and ~/.zsh_plugins.txt only if you don't have them.
zsh_enabled: true

# Ghostty terminal theme, written to a starter ~/.config/ghostty/config only
# if you don't have one. Matches the Catppuccin Mocha vim scheme.
ghostty_theme: "Catppuccin Mocha"

# vim with the vim-plug plugin manager. Creates a starter ~/.vimrc only if
# you don't have one.
vim_enabled: true

# macOS settings (dark mode, Dock auto-hide, fast key repeat, Finder showing
# extensions and hidden files). See roles/macos/defaults/main.yml to change
# them; set macos_defaults: [] to leave macOS settings alone.

# Your GitHub username. bootstrap.sh asks for it on the first run and saves
# it in vars/local.yml. Used for the dotfiles repo below and, on servers, to
# fetch the SSH keys allowed to log in (https://github.com/<user>.keys).
github_user: ""

# Your dotfiles repo, cloned to ~/.dotfiles; every file under its home/
# folder is linked into ~ (an existing file is kept as <file>.pre-dotfiles).
# Skipped if the repo doesn't exist. Without it, the zsh, vim and ghostty
# roles write starter configs instead.
dotfiles_enabled: true
dotfiles_repo: "https://github.com/{{ github_user }}/dotfiles.git"
dotfiles_dest: "~/.dotfiles"
