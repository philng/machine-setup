# Server profile, loaded over vars/apps.yml by ./bootstrap.sh --profile server.
# Runs on the server image (ghcr.io/<owner>/machine-setup-sway:server), which
# adds tmux and fail2ban, key-only SSH, a firewall that only lets SSH in
# (remote desktop over Tailscale only) and restarts into updates at 4am.
# Lists here replace the desktop ones. Anything not set here (zsh, vim, mise,
# Claude Code, dotfiles, ...) comes from vars/apps.yml unchanged.
# machine_gui is false with --headless: no Flatpaks, Toolbox or VNC.

# Flatpaks (GUI only).
flatpaks:
  - com.google.Chrome
flatpaks_remove: []

# GUI-only extras.
remote_desktop_enabled: true   # wayvnc (VNC, port 5900, Tailscale only)
# Log in to Sway automatically at boot and lock the screen straight away, so
# there's a session for VNC to show (unlock it with your password).
remote_desktop_autologin: true
jetbrains_toolbox_enabled: true

# Public keys allowed to log in over SSH (empty if github_user isn't set).
server_ssh_keys_url: "{{ 'https://github.com/' + github_user + '.keys' if github_user | default('') | length > 0 else '' }}"
